ton><div id="libraryScreen" class="library-screen" hidden><button id="closeLibraryBtn" type="button" aria-label="Back" class="back-btn">&#8249;</button><h1 class="library-title">Model Library</h1><div id="libraryGrid" class="library-grid"></div></div><a-scene tap-place landing-page xrextras-loading xrextras-runtime-error renderer="colorManagement:true" xrweb="
