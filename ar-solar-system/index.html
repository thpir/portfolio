<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System — A-Frame</title>
    <link rel="stylesheet" href="src/css/main.css" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script type="module" src="src/js/main.js"></script>
  </head>
  <body>
    <a-scene
      background="color: #000010"
      renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
    >
      <a-assets>
        <img id="tex-sun"         src="public/assets/textures/sun.jpeg" />
        <img id="tex-mercury"     src="public/assets/textures/mercury.jpeg" />
        <img id="tex-venus"       src="public/assets/textures/venus.jpeg" />
        <img id="tex-earth"       src="public/assets/textures/earth.jpeg" />
        <img id="tex-mars"        src="public/assets/textures/mars.jpeg" />
        <img id="tex-jupiter"     src="public/assets/textures/jupiter.jpeg" />
        <img id="tex-saturn"      src="public/assets/textures/saturn.jpeg" />
        <img id="tex-uranus"      src="public/assets/textures/uranus.jpeg" />
        <img id="tex-neptune"     src="public/assets/textures/neptune.jpeg" />
        <img id="tex-saturn-ring" src="public/assets/textures/saturn_ring.png" />
      </a-assets>

      <a-entity light="type: ambient; color: #ffffff; intensity: 0.15"></a-entity>

      <a-entity id="solar-system" solar-system></a-entity>

      <a-entity id="rig" position="0 10 30" rig-controls>
        <a-entity camera look-controls wasd-controls="acceleration: 40"></a-entity>
      </a-entity>
    </a-scene>

    <div id="ui">
      <h1>Solar System</h1>
      <p>Use buttons to move · drag to look</p>
    </div>

    <div id="controls">
      <button type="button" data-move="forward">Forward</button>
      <button type="button" data-move="backward">Back</button>
      <button type="button" data-move="left">Left</button>
      <button type="button" data-move="right">Right</button>
      <button type="button" data-move="up">Up</button>
      <button type="button" data-move="down">Down</button>
    </div>
  </body>
</html>
